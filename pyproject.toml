[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stipulate"
version = "0.1.0"
description = "Contracts for Python interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typing_extensions>=4.15.0"]
authors = [{name = "Stipulate contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "hypothesis==6.140.3", "ruff==0.13.2", "pyright==1.1.411", "mypy==1.19.1", "build==1.3.0", "twine==6.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stipulate = ["py.typed"]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["tests/typing_fixtures/negative.py"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
