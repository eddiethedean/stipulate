name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Run release checks
    uses: ./.github/workflows/check.yml
    with:
      release_phase: '0.1'
    permissions:
      contents: read

  build:
    name: Build and verify distribution
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require package metadata
        run: test -f pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build packaging twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Verify tag and distribution versions match
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if match is None:
              raise SystemExit(f"Release tag must match vX.Y.Z; received {tag}")
          expected = match.group(1)

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, found {wheels} and {sdists}")
          wheel_version = str(parse_wheel_filename(wheels[0].name)[1])
          sdist_match = re.search(r"-(\d+\.\d+\.\d+)\.tar\.gz$", sdists[0].name)
          if sdist_match is None:
              raise SystemExit(f"Could not read the sdist version from {sdists[0].name}")
          sdist_version = sdist_match.group(1)
          if {wheel_version, sdist_version} != {expected}:
              raise SystemExit(
                  f"Tag {expected} does not match wheel {wheel_version} and sdist {sdist_version}"
              )
          print(f"Verified release version {expected}.")
          PY

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stipulate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
