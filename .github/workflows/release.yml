name: Release to PyPI

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      release_phase: '0.1'
    permissions:
      contents: read

  verify:
    name: Verify previously checked distributions without rebuilding
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: checked-release-bundle
          path: evidence/
      - name: Check tag, embedded metadata, source digest, and every artifact hash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python -m tools.release_evidence evidence --version "${TAG_NAME#v}" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-distributions
          path: evidence/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact verified artifacts through OIDC
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stipulate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
