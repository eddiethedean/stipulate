name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_phase:
        description: Release line; a nonempty value requires complete release evidence
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.release_phase == '' }}

jobs:
  quality:
    name: Source quality on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Run runtime, lint, format, typing, design probes, and documentation gates
        run: uv run --locked --extra dev python -m tools.quality
      - uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.python }}
          path: evidence/quality/
          if-no-files-found: error

  build:
    name: Canonical distributions on Python 3.11
    needs: quality
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '315532800'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - run: uv sync --locked --extra dev --python 3.11
      - name: Build once and verify package metadata
        run: |
          uv run --locked --extra dev python -m build --sdist --wheel
          uv run --locked --extra dev twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-distributions
          path: dist/
          if-no-files-found: error

  installed:
    name: Installed ${{ matrix.kind }} on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-distributions
          path: dist/
      - name: Verify clean installed consumer, full runtime suite, and both checkers
        env:
          KIND: ${{ matrix.kind }}
          TARGET: ${{ matrix.python }}
        run: |
          if [[ "$KIND" == wheel ]]; then artifact=(dist/*.whl); else artifact=(dist/*.tar.gz); fi
          test "${#artifact[@]}" -eq 1
          uv run --locked --extra dev python -m tools.installed_check "${artifact[0]}" --output "evidence/installed/$TARGET-$KIND"
      - uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.python }}-${{ matrix.kind }}
          path: evidence/installed/
          if-no-files-found: error

  evidence:
    name: Assemble exact artifact evidence and enforce release gate
    needs: [quality, build, installed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: evidence/quality/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-*
          path: evidence/installed/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: canonical-distributions
          path: evidence/dist/
      - name: Assemble evidence; release calls require all 30 active criteria
        env:
          RELEASE_PHASE: ${{ inputs.release_phase }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$RELEASE_PHASE" ]]; then
            [[ "$RELEASE_PHASE" == 0.1 && "$TAG_NAME" =~ ^v0\.1\.[0-9]+$ ]]
            python -m tools.assemble_evidence evidence --required
            python -m tools.release_evidence evidence --version "${TAG_NAME#v}" --revision "$GITHUB_SHA"
          else
            python -m tools.assemble_evidence evidence
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: checked-release-bundle
          path: evidence/
          if-no-files-found: error
          retention-days: 14
